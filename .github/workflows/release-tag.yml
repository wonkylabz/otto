# Tags a release once its PR lands. `release.py` only opens the PR: `main` squash-merges, so
# the commit the script made never reaches `main`, and a tag cut locally pointed at an orphan
# and diverged `main`. Here the tag goes on the commit that actually landed, and only once.
# The GitHub Release (what the repo's Releases panel lists) is created from that version's
# changelog section; a tag already pushed without one gets it on the next run.
name: release-tag

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A pyproject edit that is not a version bump (a dependency, a lint rule) finds its tag
      # already there and does nothing; a bump with no dated changelog section is not a release.
      - name: Tag the version if it is new
        id: tag
        run: |
          v=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v already tagged"; exit 0
          fi
          grep -q "^## \[$v\] - " CHANGELOG.md || { echo "no dated [$v] section in CHANGELOG.md"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$v" -m "Otto v$v" "$GITHUB_SHA"
          git push origin "v$v"
      - name: Publish the GitHub Release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.tag.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V already released"; exit 0
          fi
          python release.py notes "$V" > notes.md
          gh release create "v$V" --verify-tag --title "Otto v$V" --notes-file notes.md
