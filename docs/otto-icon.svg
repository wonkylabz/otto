<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32" role="img" aria-label="Otto">
  <title>Otto</title>
  <!-- The 16-20px form: the same face with the ear loops and antenna stem dropped, because
       a 5px stroke disappears at tab size. Byte-for-byte the SVG `paintFavicon` builds in
       web/index.html, with the accent / on-accent / warn tokens resolved at the DEFAULT
       theme. Keep doubled hyphens out of this comment: XML forbids them inside one. -->
  <rect width="100" height="100" rx="26" fill="#AF5000"/>
  <rect x="26" y="30" width="48" height="52" rx="12" fill="#FFF9EC"/>
  <rect x="36" y="42" width="10" height="26" rx="5" fill="#AF5000"/>
  <rect x="54" y="42" width="10" height="26" rx="5" fill="#AF5000"/>
  <circle cx="50" cy="16" r="8" fill="#6B5600"/>
</svg>
